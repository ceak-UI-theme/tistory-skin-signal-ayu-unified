name: Validate skin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Verify committed candidate
        run: npm run verify:zip
      - name: Build fresh candidate and verify
        run: |
          built=$(bash scripts/build_skin_zip.sh)
          python3 scripts/verify_zip.py "${built#Built: }"
