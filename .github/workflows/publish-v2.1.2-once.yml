name: Publish v2.1.2 GitHub Release (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.1.2-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: publish v2.1.2 GitHub release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed package
        run: python3 scripts/verify_zip.py releases/Signal-Ayu-Unified-v2.1.2.zip
      - name: Publish verified v2.1.2 asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.1.2 >/dev/null 2>&1; then
            echo "v2.1.2 Release already exists; no duplicate created."
            exit 0
          fi
          cat > release-notes-v2.1.2.md <<'NOTES'
          ## v2.1.2 — Signal Ayu Unified 안정화

          티스토리 운영본 커스터마이징을 반영한 v2.1.1을 바탕으로 표, 공지, 접근성, 목차 및 릴리즈 검증 체계를 개선했습니다.

          ### 변경 사항
          - 본문 테이블의 편집기 스타일 충돌 완화, 모바일 가로 스크롤, 시스템 표와 분리
          - 상단 최근 공지의 미지원 요약·날짜 치환자 제거
          - 모바일 메뉴/목차 포커스 관리와 키보드 접근성 및 Light/Dark 대비 개선
          - 글·공지·정적 페이지 목차 동작과 헤딩 ID/한글 해시 보강
          - About/Privacy/Contact, 광고 치환자, 코드 복사, 읽기 시간 및 진행률 유지
          - 정적 검사·브라우저 회귀 테스트·배포 ZIP 검증 자동화

          ### 검증
          - 브라우저 회귀 테스트 15/15 PASS (개발 보고)
          - GitHub Actions Validate skin 성공: https://github.com/ceak-UI-theme/tistory-skin-signal-ayu-unified/actions/runs/41195093983
          - 검증 보고서: https://github.com/ceak-UI-theme/tistory-skin-signal-ayu-unified/blob/3a57cff/docs/STABILIZATION_v2.1.2.md
          - 추적: https://github.com/ceak-UI-theme/tistory-skin-signal-ayu-unified/issues/2

          ### 운영
          사용자 보고에 따르면 v2.1.2 운영 적용이 완료되었습니다. 이 릴리즈의 코드 기준 커밋은 3a57cff입니다. 실제 티스토리 서비스의 모든 기능을 독립적으로 재검증했다는 의미는 아닙니다.

          **설치:** 첨부 ZIP 파일을 다운로드하여 티스토리 스킨에 적용하세요. 변경 전 기존 스킨을 백업하는 것을 권장합니다.
          NOTES
          gh release create v2.1.2 releases/Signal-Ayu-Unified-v2.1.2.zip \
            --target 3a57cff2d362a435c1387593ce8fc281c9b9778e \
            --title "v2.1.2 — 운영본 병합 및 안정화" \
            --notes-file release-notes-v2.1.2.md \
            --latest
          gh release view v2.1.2 --json tagName,url,assets
